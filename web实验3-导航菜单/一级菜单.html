<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级水平导航菜单</title>
    <style>
        /*清除a默认样式*/
        a {
            text-decoration: none;
            color: #fff;
            font-size: 16px;
        }
        /*导航表格整体背景*/
        table {
            background-color: #1f4e99;
            border-collapse: collapse; /*合并表格间隙*/
        }
        /*盒模型padding扩大点击区域*/
        td {
            padding:30px 50px;
        }
        /*鼠标悬浮背景变色 hover伪类*/
        td:hover {
            background-color: #143470;
        }

    </style>
</head>
<body>
    <table align="center">
        <tr>           
            <td><a href="#">首页</a></td>
            <td><a href="#">教学院(部)</a></td>
            <td><a href="#">党群机构</a></td>
            <td><a href="#">行政教辅机构</a></td>
            <td><a href="#">教学科研</a></td>
            <td><a href="#">招生就业</a></td>
            <td><a href="#">国际交流</a></td>
            <td><a href="#">数字图书馆</a></td>
        </tr>
    </table>
    
</body>
</html>
