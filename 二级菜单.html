<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二级水平导航菜单</title>
    <style>
        /*清除ul默认样式：小圆点、内外边距*/
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        a {
            text-decoration: none;
            color: white;
            display:block;
            padding:12px 20px;
        }
        /*logo标题栏样式*/
        .logo {
            background:#0b3075;
            color:#fff;
            padding:8px 16px;
        }
        /*第二个ul开启flex，一级li水平排列*/
        body>ul:nth-child(2) {
            display:flex;
            background:#1f4e99;
        }
        /*一级li设置relative，作为二级菜单定位父容器！！*/
        body>ul:nth-child(2) > li {
            position: relative;
        }
        /*二级下拉菜单：绝对定位，默认隐藏*/
        body>ul:nth-child(2) > li > ul {
            position:absolute;
            top:100%;
            left:0;
            background:#3058a8;
            display:none;
            z-index:999; /*防止被页面其他元素盖住*/
        }
        /*二级菜单li宽度固定*/
        body>ul:nth-child(2) > li > ul > li {
            width:200px;
        }
        /*鼠标悬浮一级li，显示二级下拉菜单*/
        body>ul:nth-child(2)>li:hover>ul{
            display:block;
        }
        /*hover悬停背景变色*/
        body>ul:nth-child(2) li a:hover{
            background:#143470;
        }
    </style>
</head>
<body>
    <ul>
        <li class="logo">欢迎访问湖南文理学院</li>
    </ul>
    <ul>         
        <li><a href="#">首页</a></li>
        <li><a href="#">教学院(部)</a>
            <ul>
                <li><a href="#">计算机与电气工程学院</a></li>
                <li><a href="#">芙蓉学院</a></li>
            </ul>
        </li>
        <li><a href="#">党群机构</a></li>        
        <li><a href="#">行政教辅机构</a></li>
        <li><a href="#">教学科研</a></li>
        <li><a href="#">招生就业</a></li>
        <li><a href="#">国际交流</a></li>
        <li><a href="#">数字图书馆</a></li>
    </ul>    
</body>
</html>
